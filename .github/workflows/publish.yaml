name: Publish

on:
  push:
    branches: [master]
    paths:
      - docker/**

permissions:
  contents: write
  packages: write

env:
  DAGGER_VERSION: 0.21.7

jobs:
  prepare-targets:
    name: Prepare targets
    runs-on: ubuntu-latest

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: List changed Bake targets
        id: targets
        run: |
          targets="$(
            make --no-print-directory changed-components \
              BASE_REF="${{ github.event.before }}" \
              HEAD_REF="${{ github.sha }}" \
              SHARED_PATHS=
          )"
          {
            echo 'targets<<EOF'
            echo "$targets"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: prepare-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-targets.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Publish Bake target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make publish "${{ matrix.target }}" REGISTRY_USERNAME="${{ github.actor }}"
