name: Publish

on:
  push:
    branches: [master]
    paths:
      - docker/**

permissions:
  contents: write
  packages: write

env:
  DAGGER_VERSION: 0.20.8

jobs:
  prepare-targets:
    name: Prepare targets
    runs-on: ubuntu-latest

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: List changed Bake targets
        id: targets
        run: |
          targets="$(
            dagger -m github.com/riftonix/daggerverse/modules/git@modules/git/v1.0.1 \
              call --json --source=. \
              get-changed-components \
              --base-ref="${{ github.event.before }}" \
              --head-ref="${{ github.sha }}" \
              --component-roots='docker/*'
          )"
          {
            echo 'targets<<EOF'
            echo "$targets"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: prepare-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-targets.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Publish Bake target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger <<'EOF'
          published_refs=$(
            github.com/riftonix/daggerverse/scenarios/container-images@scenarios/container-images/v0.1.2 |
              with-registry-auth \
                --address=ghcr.io \
                --username="${{ github.actor }}" \
                --password=env://GITHUB_TOKEN |
              publish-bake-target \
                --source=. \
                --bake-path="${{ matrix.target }}/docker-bake.json"
          )
          tag=$(
            github.com/riftonix/daggerverse/scenarios/container-images@scenarios/container-images/v0.1.2 |
              get-bake-release-tag \
                --source=. \
                --bake-path="${{ matrix.target }}/docker-bake.json" \
                --component-path="${{ matrix.target }}"
          )
          github.com/riftonix/daggerverse/modules/git@modules/git/v1.0.1 --source=. |
            with-https-token-auth \
              --host=github.com \
              --username=x-access-token \
              --token=env://GITHUB_TOKEN |
            ensure-pushed-tag --tag="$tag"
          EOF
