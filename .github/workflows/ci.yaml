name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  DAGGER_VERSION: 0.20.8

jobs:
  prepare-targets:
    name: Prepare targets
    runs-on: ubuntu-latest

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: List changed Bake targets
        id: targets
        run: |
          targets="$(
            make --no-print-directory changed-components \
              SHARED_PATHS='.github/workflows renovate.json Makefile'
          )"
          {
            echo 'targets<<EOF'
            echo "$targets"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: prepare-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-targets.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Verify Bake target
        run: make verify "${{ matrix.target }}"

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - prepare-targets
      - verify
    if: ${{ always() }}

    steps:
      - name: Check CI jobs
        env:
          PREPARE_TARGETS_RESULT: ${{ needs.prepare-targets.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$PREPARE_TARGETS_RESULT" = success
          test "$VERIFY_RESULT" = success || test "$VERIFY_RESULT" = skipped
